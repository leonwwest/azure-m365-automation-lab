name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check src tests
      - run: pytest -q
      - name: Verify sanitized PowerShell export
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.6.1 -Force -Scope CurrentUser
          Invoke-Pester powershell/tests -CI
      - name: Produce demonstration report
        run: |
          PYTHONPATH=src python -m tenant_guard.cli inventory/sample-tenant.json \
            --output reports/ci --fail-on never
