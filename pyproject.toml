[project]
name = "azure-m365-automation-lab"
version = "1.0.0"
description = "Tenant-free Azure and Microsoft 365 governance automation portfolio lab."
requires-python = ">=3.11"

[project.scripts]
tenant-guard = "tenant_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

